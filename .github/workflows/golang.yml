name: Golang

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tidy
        run: make tidy
      - name: Verify tidiness
        run: git diff --exit-code -- go.mod go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Test
        run: make test
      - name: Test public CA interoperability
        continue-on-error: true
        run: make test-network

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
      - name: Warm Go module services
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          go mod init warmup.invalid
          go mod download "github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
